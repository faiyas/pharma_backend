name: Daily Database Health Check

on:
  schedule:
    # 18:30 UTC = 12:00 AM IST (Indian Standard Time)
    - cron: '30 18 * * *'
    # 00:00 UTC = 12:00 AM UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  db-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live API Database Check
        run: |
          RENDER_URL="${{ secrets.RENDER_BACKEND_URL || 'https://pharma-backend-drjq.onrender.com' }}"
          echo "Checking live database connectivity via $RENDER_URL/api/db-check/..."
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -m 45 "$RENDER_URL/api/db-check/" || echo "FAILED\n000")
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Live database check succeeded! Backend and Supabase database are healthy."
            exit 0
          else
            echo "Direct API check returned $HTTP_CODE, trying fallback query..."
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install django dj-database-url psycopg2-binary djangorestframework django-cors-headers djangorestframework-simplejwt whitenoise

      - name: Run Silent Database Health Query
        working-directory: backend
        env:
          # Use Supabase IPv4 Connection Pooler (Supavisor) on port 6543 to avoid IPv6 unreachable errors on GitHub Actions runners
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.jhwzdsgqstlowvuxpzyf:Faroz%409565%23123@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require' }}
          SECRET_KEY: 'ci-secret-key-check'
        run: |
          python manage.py db_check || echo "Warning: Direct runner connection skipped (IPv6 restriction)."
